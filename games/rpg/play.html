<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e4f1f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゆきのもり">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゆきのもりRPG</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c2dee9;color:#193b43;font-family:system-ui,sans-serif}
#game{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#e4f1f5;padding:24px;text-align:center}
progress{width:min(280px,80vw);height:12px;accent-color:#527e86}
#message{max-width:440px;line-height:1.7}button{padding:14px 28px;background:#244f58;color:white;border:0;border-radius:8px;font:inherit}
</style>
</head>
<body><main id="game"><canvas id="unity-canvas" tabindex="0" aria-label="ゆきのもりゲーム画面"></canvas>
<div id="loading"><h1>ゆきのもり</h1><div id="message">森を読み込んでいます</div><progress id="progress" max="1" value="0"></progress><a href="./">遊び方・ホーム画面への追加</a><button id="retry" hidden>再読み込み</button></div></main>
<script src="Build/0.4.10/Web.loader.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
const canvas=document.getElementById('unity-canvas');
const message=document.getElementById('message');
const retry=document.getElementById('retry');
retry.onclick=()=>location.reload();
canvas.addEventListener('contextmenu',e=>e.preventDefault());
// Keep gestures inside the game canvas; Unity still receives the touch events.
for (const name of ['gesturestart','gesturechange','gestureend'])
 canvas.addEventListener(name,e=>e.preventDefault(),{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
createUnityInstance(canvas,{
 arguments:[],
 dataUrl:"Build/0.4.10/Web.data.unityweb",
 frameworkUrl:"Build/0.4.10/Web.framework.js.unityweb",
 codeUrl:"Build/0.4.10/Web.wasm.unityweb",
 streamingAssetsUrl:"StreamingAssets",
 companyName:"satomuraworks",
 productName:"ゆきのもり 森さんぽ",
 productVersion:"0.4.10",
 devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)
},p=>{document.getElementById('progress').value=p;message.textContent='森を読み込んでいます '+Math.round(p*100)+'%';})
.then(instance=>{document.getElementById('loading').hidden=true;document.getElementById('loading').style.display='none';canvas.focus();window.yukinomoriInstance=instance;})
.catch(error=>{message.textContent='読み込みを完了できませんでした。ほかのタブを閉じて再度お試しください。';document.getElementById('progress').hidden=true;retry.hidden=false;console.error(error);});
</script></body></html>
